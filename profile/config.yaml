# Snakemake >=8 profile for the AAU BioCloud cluster.
# Submission is handled by the native SLURM executor plugin, so there is no
# hand-written sbatch command and no cluster-status polling script any more.
executor: slurm

# Replaces the old `use-conda: True`
software-deployment-method:
  - conda

# Defaults for any rule that does not set them itself.
# NOTE: `runtime` is an INTEGER NUMBER OF MINUTES in Snakemake >=8.
# BioCloud assigns partitions automatically from the mem-per-CPU ratio,
# so slurm_partition is deliberately NOT set here.
default-resources:
  runtime: 60
  mem_mb: 512
  qos: "normal"

# bio-node10 (the only GPU node) has 64 threads; nothing can use more.
max-threads: 64

jobs: 50
local-cores: 1
latency-wait: 120
restart-times: 0
max-jobs-per-second: 10
keep-going: True
rerun-incomplete: True
printshellcmds: False

# Plugin conveniences that replace things we used to hand-roll
slurm-keep-successful-logs: True
slurm-efficiency-report: True