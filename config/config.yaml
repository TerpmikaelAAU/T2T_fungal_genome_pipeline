# ============================================================================
#  Per-sample configuration
# ============================================================================
#   type: pod5   -> full pipeline: basecall -> correct -> assemble -> polish
#   type: bam    -> skips basecalling; still polished (polishing needs a BAM)
#   type: fastq  -> skips basecalling AND polishing; ends at the raw assembly
#
# 'path' must be an ABSOLUTE path.
#   pod5  -> a DIRECTORY of .pod5 files
#   bam   -> a single basecalled .bam file
#   fastq -> a single .fastq or .fastq.gz file
#
# Optional per-sample keys:
#   busco_lineage : BUSCO dataset          (default: fungi_odb12)
#   organelle     : GetOrganelle database, or 'none' to skip (default: none)
#   subsample     : coverage cap; omit to use ALL reads (recommended)
# ---------------------------------------------------------------------------
samples:
  p_infestans_88069:
    type: fastq
    path: /home/bio.aau.dk/zl01hh/P_infestans_88069_Nanopore_Raw/P_infestans_88069.fastq.gz
    busco_lineage: stramenopiles_odb12
    organelle: none
    porechop: false
    # Single-cell run: this sample already has its own q20_l1000 hifiasm
    # assembly (data/hifiasm/p_infestans_88069_q20_l1000/). Without this
    # override, contig_count/assembly_stats fall back to the GLOBAL config
    # filter grid below (currently tiia_apiospora's 3x4=12 cells) and would
    # try to build 11 more p_infestans hifiasm assemblies it never asked for.
    filter:
      min_q:   [20]
      min_len: [1000]

  tiia_apiospora:
    type: fastq
    path: /home/bio.aau.dk/zl01hh/Tiia_assembly_Apiospora/Merged.fastq
    porechop: false
    # busco_lineage left at default (fungi_odb12) -- unlike p_infestans_88069
    # this is an actual fungus. organelle left at default (none/off).


