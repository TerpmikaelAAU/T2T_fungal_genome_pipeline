# Every setting is explained in README.md, "Configuring a run".

samples:
  sample_a:
    type: fastq
    path: example_data/sample_a.fastq.gz
    porechop: false
    ultralong: false
    filter:
      min_q:   [20]
      min_len: [1000]

  sample_b:
    type: fastq
    path: example_data/sample_b.fastq

  sample_c:
    type: pod5
    path: example_data/sample_d_pod5
    busco_lineage: fungi_odb12
    dorado_correct: true
    organelle: true
    organelle_type: fungus_mt

  sample_d:
    type: bam
    path: example_data/sample_c.bam
    busco_lineage: embryophyta_odb12

dorado:
  version: "2.1.2"

dorado_polish:
  device: "cuda:all"

dorado_correct:
  enabled: false
  min_q: 10
  min_len: 10000
  index_size: "4G"
  inference_device: "cuda:all"

ultralong:
  enabled: true
  min_q: 10
  min_len: 50000

hifiasm_min_input_mb: 1

min_assembly_mb: 10

prefilter:
  enabled: true
  min_q: 10
  min_len: 10000

filter:
  min_q:   [10, 15, 20]
  min_len: [10000, 15000, 20000, 25000, 30000]

telomere:
  enabled: true
  top_motifs: 10
  explore_min_len: 5
  explore_max_len: 12
  explore_threshold: 10
  window: 2000
  min_repeats: 10
  rerun_hifiasm: true
  rerun_min_fraction: 0.8
  rerun_min_ends: 4
  fallback_motif: TTAGGG

contamination:
  enabled: true
  min_len: 3000

phylogeny:
  enabled: false
  taxon: "Fungi"

bags:
  enabled: false
  geneml_version: "1.1.0"
